name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_SSH_KEY }}
        known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

    - name: Adding Known Hosts
      run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
    - name: Deploy to EC2
      run: |
        # Create a zip file directly using git archive
        git archive --format=zip --output=./deploy.zip HEAD
        
        # First, ensure destination directory exists
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "mkdir -p ~/food-delivery-system"
        
        # Copy zip file to EC2
        scp deploy.zip ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/food-delivery-system/
        
        # Execute remote commands to install unzip, extract files and set up
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'sudo apt-get update && \
          sudo apt-get install -y unzip && \
          cd ~/food-delivery-system && \
          unzip -o deploy.zip && \
          rm deploy.zip && \
          
          # Create necessary directories
          mkdir -p ./services/user-service ./services/restaurant-service ./services/order-service ./services/payment-service ./services/delivery-service ./api-gateway ./frontend && \
          
          # Make scripts executable
          find . -name "*.sh" -exec chmod +x {} \; || true && \
          
          # Build and start containers
          docker-compose up -d --build'
