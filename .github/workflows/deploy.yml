name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_SSH_KEY }}
        known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

    - name: Adding Known Hosts
      run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
    - name: Prepare deployment files
      run: |
        # Create a deployment directory and copy files there
        mkdir -p deploy_temp
        cp -r $(ls -A | grep -v ".git" | grep -v "node_modules" | xargs) deploy_temp/
        
        # Create a deployment archive
        cd deploy_temp
        tar -czf ../deploy.tar.gz .
        cd ..
        
    - name: Deploy to EC2
      run: |
        # First, create directory if it doesn't exist
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "mkdir -p ~/food-delivery-system"
        
        # Copy archive to EC2
        scp deploy.tar.gz ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/food-delivery-system/
        
        # Execute remote commands
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'cd ~/food-delivery-system && \
          tar -xzf deploy.tar.gz && \
          rm deploy.tar.gz && \
          
          # Create necessary directories for env files if they dont exist
          mkdir -p ./services/user-service ./services/restaurant-service ./services/order-service ./services/payment-service ./services/delivery-service ./api-gateway ./frontend && \
          

          
          # Make sure all shell scripts are executable
          find . -name "*.sh" -exec chmod +x {} \; || true && \
          
          # Build and start containers
          docker-compose up -d --build'
