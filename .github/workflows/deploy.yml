name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Get full repo without truncating
    
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_SSH_KEY }}
        known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

    - name: Adding Known Hosts
      run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
    - name: Prepare deployment files
      run: |
        # Create a deployment archive without .git directory
        tar --exclude='.git' --exclude='node_modules' -czf deploy.tar.gz .
        
    - name: Deploy to EC2
      run: |
        # First, create directory if it doesn't exist
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "mkdir -p ~/food-delivery-system"
        
        # Copy archive to EC2
        scp deploy.tar.gz ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/food-delivery-system/
        
        # Execute remote commands
        ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "cd ~/food-delivery-system && \
          tar -xzf deploy.tar.gz && \
          rm deploy.tar.gz && \
          
          # Create production environment files
          mkdir -p ./services/user-service/.env.production ./services/restaurant-service/.env.production && \
          
          # Update MongoDB URI in environment files
          find ./services -name '.env*' -type f -exec sed -i 's|mongodb://mongo:27017|mongodb://localhost:27017|g' {} \; && \
          
          # Make sure all shell scripts are executable
          find . -name '*.sh' -exec chmod +x {} \; && \
          
          # Build and start containers
          docker-compose up -d --build"
